server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page app: every unknown path is a client route, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The browser talks to one origin; nginx forwards the API half to the backend container.
  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # An agent run is a long model call. Do not cut it off at nginx's default minute.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
