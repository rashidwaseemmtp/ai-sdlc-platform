name: ai-sdlc-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sdlc-postgres
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: sdlc
      POSTGRES_DB: sdlc
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sdlc -d sdlc']
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-postgres:
    image: postgres:16-alpine
    container_name: sdlc-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporaldata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sdlc-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: sdlc-temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports: ['7233:7233']
    volumes:
      - ../temporal:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ['CMD', 'tctl', '--address', 'temporal:7233', 'workflow', 'list']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: sdlc-temporal-ui
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ['8233:8080']

volumes:
  pgdata:
  temporaldata:
  redisdata:
